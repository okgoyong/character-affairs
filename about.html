<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐릭터 어페어스를 소개합니다 - CHARACTER AFFAIRS</title>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1e;
            --accent-blue: #007aff;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Header Navigation */
        header {
            width: 100%;
            padding: 24px 40px;
            min-height: 86px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 50;
        }

        .header-logo {
            display: flex;
            align-items: center;
            min-height: 57px;
            text-decoration: none;
        }

        .header-logo img {
            height: 57px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .header-nav a {
            color: #d1d1d6;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            transition: color 0.2s ease;
        }

        .header-nav a:hover,
        .header-nav a.active {
            color: #ffffff;
            font-weight: 700;
        }

        /* About Main Section */
        main.about-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 60px;
            width: 100%;
        }

        .about-title-wrap {
            text-align: center;
            margin-bottom: 30px;
        }

        .about-title-wrap h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .about-title-wrap p {
            font-size: 1rem;
            color: var(--text-sub);
        }

        .about-img-box {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .about-img-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        footer p {
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        @media (max-width: 768px) {
            header {
                padding: 18px 20px;
                flex-direction: column;
                gap: 16px;
            }
            .header-logo img {
                height: 42px;
            }
            .header-nav {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .about-title-wrap h1 {
                font-size: 1.4rem;
            }
            main.about-container {
                padding: 10px 15px 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="./index.html" class="header-logo" title="CHARACTER AFFAIRS">
            <img src="./assets/CHARACTER-AFFAIRS-bi.png" alt="CHARACTER AFFAIRS" onerror="this.onerror=null; this.src='./CHARACTER-AFFAIRS-bi.png';">
        </a>
        <nav class="header-nav">
            <a href="./about.html" class="active">캐릭터 어페어스 소식</a>
            <a href="https://www.kocda.org/" target="_blank" rel="noopener noreferrer">캐릭터디자이너협회</a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeMtbI7-vfspuZ8JHCC7lwLn-b09OSdIMEJkA5lkKbTlsdgMw/viewform" target="_blank" rel="noopener noreferrer">크루(기자)모집</a>
            <a href="javascript:void(0);" onclick="alert('기사 투고/제안 시스템 준비 중입니다. 잠시만 기다려 주세요!');">기사 투고 제안</a>
        </nav>
    </header>

    <!-- Content -->
    <main class="about-container">
        <div class="about-title-wrap">
            <h1>캐릭터 어페어스를 소개합니다</h1>
            <p>GLOBAL CHARACTER &amp; SUBCULTURE MAGAZINE</p>
        </div>

        <div class="about-img-box">
            <!-- 첨부된 소개 이미지 (assets 폴더 안의 bar_sub.jpg) -->
            <img src="./assets/bar_main.png" alt="캐릭터 어페어스 공식 소개 메인" onerror="this.onerror=null; this.src='./bar_main.png';">
            <img src="./assets/bar_sub.png" alt="캐릭터 어페어스 창간호 공식 소개" onerror="this.onerror=null; this.src='./bar_sub.png';">
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; CHARACTER AFFAIRS. All rights reserved.</p>
    </footer>

</body>
</html>
